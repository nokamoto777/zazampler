name: macOS arm64 build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test macOS arm64
    runs-on: macos-15
    timeout-minutes: 60
    env:
      BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check toolchain
        run: |
          test "$(uname -m)" = arm64
          xcodebuild -version
          if ! command -v cmake >/dev/null; then brew install cmake; fi
          cmake --version
      - name: Build, test and verify signatures
        shell: bash
        run: |
          set -o pipefail
          mkdir -p ci-logs
          bash scripts/build-macos.sh 2>&1 | tee ci-logs/build-macos.log
      - name: Render resized editor previews
        run: |
          for size in small large wide; do
            build-macos/Release/processor_test "--snapshot-$size" "$PWD/ci-logs/editor-$size.png"
          done
      - name: Package binary bundles
        run: bash scripts/package-macos.sh
      - name: Upload binaries
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ZaZampler-macOS-arm64-${{ github.run_number }}
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Upload build and test logs
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: macOS-build-logs-${{ github.run_number }}
          path: |
            ci-logs/
            build-macos/Testing/Temporary/
            build-macos/CMakeFiles/CMakeConfigureLog.yaml
          if-no-files-found: warn
          retention-days: 14

  release:
    name: Publish Release assets
    needs: build
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: ZaZampler-macOS-arm64-${{ github.run_number }}
          path: dist
      - name: Publish tested binaries
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          archive=dist/ZaZampler-macOS-arm64.zip
          test -s "$archive"
          (cd dist && sha256sum ZaZampler-macOS-arm64.zip > SHA256SUMS.txt)
          if [[ "$REF_TYPE" == tag ]]; then
            tag="$REF_NAME"
            title="ZaZampler $tag"
            flags=(--verify-tag)
          else
            tag="ci-${GITHUB_RUN_NUMBER}"
            title="ZaZampler development build ${GITHUB_RUN_NUMBER}"
            flags=(--prerelease --latest=false)
          fi
          cat > release-notes.md <<EOF
          macOS arm64: VST3 / AUv2 / Standalone with embedded AUv3.

          Download **ZaZampler-macOS-arm64.zip** below, extract it, and run:
          \`bash scripts/install-macos.sh\`

          Ad-hoc signed development binary; not Developer ID signed or notarized.
          See the included README.md and CHANGES.md for usage and change history.

          Commit: ${GITHUB_SHA}
          Build and tests: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          EOF
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$archive" dist/SHA256SUMS.txt --clobber
          else
            gh release create "$tag" "$archive" dist/SHA256SUMS.txt \
              --target "$GITHUB_SHA" --title "$title" --notes-file release-notes.md "${flags[@]}"
          fi
